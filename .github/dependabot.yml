version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      oxc:
        patterns:
          - "oxc_*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # ovsx publish rejects the VS Code extension when
      # @types/vscode > engines.vscode. Bumping the types without also
      # raising the minimum supported VS Code version breaks the Open VSX
      # release, so pin this and lift it by hand together with engines.vscode.
      - dependency-name: "@types/vscode"

      # starlight 0.39.0 removed the `{ label, autogenerate }` sidebar shape,
      # 0.40.0 raised the astro minimum to 6.4.5, and 0.41.0 dropped astro 6.
      # docs/site still pins astro ^6.1.8, so any release after 0.38.x breaks
      # the Deploy Site build. This package is 0.x, so the minor is its
      # breaking boundary: block minor and major, let patch updates through.
      # Remove this entry when the astro 7 upgrade lands, issue #1461.
      - dependency-name: "@astrojs/starlight"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    # Dependabot rejects the per-semver-level cooldown keys for this
    # ecosystem: an action tag carries no semver level it can read. Only
    # `default-days` is supported here. The cargo and npm blocks above keep
    # the full set.
    cooldown:
      default-days: 7
    groups:
      # security.yml reaches into google/osv-scanner-action three times: the
      # reusable workflow for pushes and the schedule, plus the scanner
      # action and the reporter action inlined in the pull request job.
      # Dependabot tracks each path as its own dependency, so an ungrouped
      # release arrives as three pull requests that can land out of order and
      # leave the three on different versions. Group them so they move
      # together.
      osv-scanner-action:
        patterns:
          - "google/osv-scanner-action*"
