name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-scan weekly so newly-disclosed CVEs against unchanged
    # dependencies get caught even when nothing in the repo changed.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Two OSV jobs, one for each trigger, because the two triggers ask
  # different questions.
  #
  # A pull request asks "does this branch add a vulnerability?". The
  # reusable PR workflow scans the base branch, then scans the head
  # branch, then fails only on the difference. The plain workflow fails on
  # every advisory in the tree, so each pull request inherited the whole
  # backlog on main and went red for advisories it never touched. That
  # taught us to merge through a red check.
  #
  # A push to main and the weekly schedule ask "what is in the tree right
  # now?". Those keep the full blocking scan. They stay red until somebody
  # clears the backlog. Nothing here filters or hides a finding.
  #
  # The backlog on 2026-08-18 was 44 npm advisories in 12 packages. All of
  # them sit in docs/site, in the example apps, or in dev tooling. None of
  # them reaches a published @floeorg package, because those ship no
  # third-party runtime dependency. Dependabot #1449 covers esbuild,
  # #1487 covers sharp, and #1461 covers the astro 7 upgrade.
  osv-scanner-pr:
    name: OSV-Scanner (Cargo + npm)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=Cargo.lock
        --lockfile=pnpm-lock.yaml
      upload-sarif: true

  osv-scanner:
    name: OSV-Scanner (Cargo + npm)
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=Cargo.lock
        --lockfile=pnpm-lock.yaml
      upload-sarif: true

  cargo-deny:
    name: cargo-deny (advisories · licenses · sources · bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb # v2.0.17
        with:
          command: check advisories licenses sources bans

  zizmor:
    name: zizmor (GitHub Actions static analysis)
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # continue-on-error: existing workflows have findings that are out of
      # scope for this PR (tracked in #1404). zizmor still uploads SARIF to
      # the Security tab so findings are visible; flip to blocking once the
      # cleanup issue lands.
      - uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        continue-on-error: true
