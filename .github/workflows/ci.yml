name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (fmt · test · clippy · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ci-profile

      - name: Install nextest
        uses: taiki-e/install-action@831231fdad2d3455d6c38b8144fa99d3adaca36e # nextest

      # `crates/floe-core/tests/parse_runtime.rs` runs the emitted
      # TypeScript to prove the `parse<T>` validation accepts a valid
      # value. Node strips the types, so the Rust job needs a pinned Node
      # rather than whatever the runner image ships.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # fmt first — fail fast on trivial issues.
      - name: Format check
        run: cargo fmt -- --check

      # Test before clippy: nextest does the full codegen + link, then
      # clippy reuses those artifacts instead of recompiling workspace
      # crates from metadata.
      - name: Tests
        run: cargo nextest run --cargo-profile ci

      - name: Clippy
        run: cargo clippy --profile ci -- -D warnings

      - name: Build
        run: cargo build --profile ci

      - name: Check Floe code samples in docs
        # User-facing docs + llms.txt (LLMs generate Floe code from these — they
        # MUST parse).
        run: cargo run --profile ci -p floe-doc-check -- docs/site/ docs/llms.txt README.md

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: floe-binary
          path: target/ci/floe
          retention-days: 1

  integration:
    name: Integration tests (floe check & build)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: floe-binary

      - name: Make binary executable
        run: chmod +x floe

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install pnpm
        # No `version:` — action-setup reads packageManager from
        # package.json so local and CI use the exact same pnpm.
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Aikido safe-chain
        # Installs PATH shims that intercept pnpm/npm/yarn/npx and check
        # every package against Aikido's feed of known-malicious releases
        # before the install runs. Must come before pnpm install so the
        # shims are on PATH when packages are fetched.
        env:
          # pnpm dlx itself honors minimum-release-age, which would refuse
          # to fetch the safe-chain CLI. Disable the cooldown for this one
          # invocation; the shims it installs are the actual control.
          npm_config_minimum_release_age: "0"
        run: pnpm dlx @aikidosec/safe-chain@1.5.1 setup-ci

      - name: Install example dependencies
        run: pnpm install --frozen-lockfile

      - name: Floe format check
        run: |
          ./floe fmt --check examples/todo-app/src/
          ./floe fmt --check examples/store/src/
          ./floe fmt --check examples/hono-api/src/

      - name: Floe check examples
        run: |
          ./floe check examples/todo-app/src/
          ./floe check examples/store/src/
          ./floe check examples/hono-api/src/

      - name: Floe build examples
        run: |
          ./floe build examples/todo-app/src/
          ./floe build examples/store/src/
          ./floe build examples/hono-api/src/

      - name: TypeScript type-check examples
        run: |
          npx tsc --noEmit -p examples/store/tsconfig.json
          npx tsc --noEmit -p examples/todo-app/tsconfig.json

      # The example Vite configs point `compiler:` at `target/debug/floe`,
      # because that is what a developer box builds. This job downloads the
      # `ci` profile binary instead, so copy it under the name the configs
      # name. The two profiles differ in optimisation only.
      #
      # This step is REQUIRED, not a convenience. The plugin resolves its
      # `.floe/` lookup against the Vite root, which is the example directory,
      # so it reads `examples/store/.floe/src/`. The `Floe build examples` step
      # above runs from the repository root and writes
      # `.floe/examples/store/src/` instead. The two paths never meet, so the
      # plugin finds no cached output and spawns this binary once per `.fl`
      # file. Delete this step and both bundles fail.
      - name: Put the binary where the example Vite configs look for it
        run: |
          mkdir -p target/debug
          cp floe target/debug/floe

      # A .fl file that a hand-written .tsx imports broke every production
      # bundle under Vite 8 (#1567). These two builds are the proof that a
      # person who follows the documented setup can still ship.
      - name: Bundle the React examples with Vite
        run: |
          pnpm --filter floe-store build
          pnpm --filter floe-todo-app build

      - name: Bundler plugin tests
        # The esbuild plugin's tests call `floe` from PATH. The Vite plugin's
        # tests use `target/debug/floe` from the step above, and fall back to
        # PATH, so the export serves both suites.
        run: |
          PATH="$PWD:$PATH" pnpm --filter @floeorg/vite-plugin test
          PATH="$PWD:$PATH" pnpm --filter @floeorg/esbuild-plugin test

  typecheck-emitted:
    name: Type-check emitted TypeScript (ratchet)
    needs: rust
    runs-on: ubuntu-latest
    # `floe build` writes `// @ts-nocheck` on every emitted file, so tsc has
    # never checked any of it. The first run of this job found 89 diagnostics
    # across the store and todo-app examples, in 15 groups: dropped generic
    # type arguments on `useState<T>`, a literal `undefined /* type error */`
    # placeholder for `useSuspenseQuery`, trait impl methods that are neither
    # exported nor imported, `JSX.Element` under React 19, and more. Epic
    # #1490 groups them, #1492 to #1499 break out the serious ones, and #1470
    # is the original report.
    #
    # This job is a RATCHET, not a pass or fail. It counts diagnostics per
    # TypeScript error code and compares each count against
    # scripts/typecheck-emitted-baseline.txt. It passes at or below the
    # baseline and fails above it, so it is green today, red the moment
    # somebody adds a new diagnostic, and it walks to zero as the issues
    # above land. It does NOT use `continue-on-error`: that leaves the check
    # run reporting FAILURE on every pull request, and a red job teaches
    # everyone to ignore it.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: floe-binary

      - name: Make binary executable
        run: chmod +x floe

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Aikido safe-chain
        # Same control as the integration job: PATH shims check every package
        # against Aikido's feed before the install runs.
        env:
          npm_config_minimum_release_age: "0"
        run: pnpm dlx @aikidosec/safe-chain@1.5.1 setup-ci

      - name: Install example dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit without @ts-nocheck and run tsc against the ratchet
        # The script writes the per-code table to $GITHUB_STEP_SUMMARY, so
        # the counts show on the run page without opening the log.
        run: ./scripts/typecheck-emitted.sh ./floe

  lsp:
    name: LSP integration tests
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: floe-binary

      - name: Make binary executable
        run: chmod +x floe

      - name: Install pytest
        run: pip install pytest

      - name: LSP integration tests
        run: python3 -m pytest tests/lsp/ --floe-bin=./floe -v --tb=short

  tree-sitter:
    name: Tree-sitter grammar (generate + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install tree-sitter-cli
        uses: taiki-e/install-action@b5fddbb5361bce8a06fb168c9d403a6cc552b084 # v2.75.29
        with:
          tool: tree-sitter-cli@0.26.8

      - name: Regenerate parser
        working-directory: editors/tree-sitter-floe
        run: tree-sitter generate

      - name: Fail if grammar.js drifted from committed artifacts
        working-directory: editors/tree-sitter-floe
        run: |
          if ! git diff --exit-code src/; then
            echo "::error::grammar.js has drifted from committed src/ artifacts."
            echo "::error::Run 'pnpm --filter tree-sitter-floe regen' and commit src/."
            exit 1
          fi

      - name: Run corpus tests
        working-directory: editors/tree-sitter-floe
        run: tree-sitter test

  install-script:
    name: Install script smoke test (${{ matrix.os }})
    # install.sh fetches the latest GitHub release. Release-please PRs run
    # *before* any release exists for the new version, so the smoke test
    # would 404 on `releases/latest` when there are no releases at all (or
    # pass against an outdated tarball that doesn't match the PR's version).
    # Skip on release-please PRs; the post-merge push-to-main run covers
    # the real validation once the release exists.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck -s sh install.sh

      - name: Run install.sh against the latest release
        # The script pulls from the GitHub Release, not this commit — we
        # just verify the OS/arch detection + tarball path still resolve
        # and the binary runs. GITHUB_TOKEN lifts the API rate limit so
        # the shared-NAT macOS runner doesn't 403 on `releases/latest`.
        env:
          INSTALL_DIR: ${{ runner.temp }}/floe-install
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh install.sh
          "$INSTALL_DIR/floe" --version
