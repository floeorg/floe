# cargo-deny configuration. Run `cargo deny check` locally to mirror CI.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# cargo-deny accepts only `id` and `reason` on an ignore entry. It has no
# expiry field, so the review date lives in the reason string and in this
# comment. Read this entry again on 2026-11-18, and delete it when #1403
# closes. osv-scanner.toml holds the same ignore with a real `ignoreUntil`.
ignore = [
    # bincode 2.x. The maintainers stopped development in 2025. That is a
    # maintenance signal, not a vulnerability: RUSTSEC-2025-0141 reports no
    # exploitable defect. Re-evaluate a successor crate (postcard, bitcode,
    # rkyv) when the migration is worth the churn.
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, not vulnerable. Review on 2026-11-18, tracked in #1403." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Internal workspace crates use `path = "..."` without a version
# constraint. cargo-deny flags those as wildcards by default; allow
# them since they're first-party deps under our control.
allow-wildcard-paths = true
highlight = "all"

[sources]
# Only allow crates from the official registry. A transitive dep pulled
# from a git URL or local path would bypass crates.io's signing and yank
# protection; refuse those outright.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
